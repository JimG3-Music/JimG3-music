<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jim G3 | Music</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      background: linear-gradient(
        rgba(0,0,0,.45),
        rgba(0,0,0,.9)
      );
    }

    h1 {
      font-size: 64px;
      margin: 0;
      letter-spacing: 5px;
    }

    .tagline {
      font-size: 20px;
      margin-top: 15px;
      color: #ccc;
    }

    .button {
      display: inline-block;
      margin-top: 35px;
      padding: 15px 30px;
      border: 1px solid white;
      color: white;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    section {
      padding: 70px 25px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      font-size: 34px;
      letter-spacing: 3px;
    }

    p {
      color: #ccc;
      line-height: 1.7;
      font-size: 17px;
    }

    footer {
      padding: 30px;
      border-top: 1px solid #222;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>JIM G3</h1>
    <div class="tagline">MUSIC • STORIES • REAL LIFE</div>
    <a href="#music" class="button">Enter</a>
  </header>

  <section id="music">
    <h2>MUSIC</h2>
    <p>
      Welcome to the official Jim G3 music site.
      Music, stories and songs written from real life.
    </p>
  </section>

  <section>
    <h2>ABOUT</h2>
    <p>
      Jim G3 is an independent artist creating music
      with honesty, emotion and a message.
    </p>
  </section>

  <footer>
    © 2026 Jim G3
  </footer>

</body>
</html>
